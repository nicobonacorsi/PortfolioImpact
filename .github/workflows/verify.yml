name: Portfolio Impact verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Test analysis engine and HTTP application
        run: python -m pytest -q -p no:cacheprovider
      - name: Check UI JavaScript
        run: |
          node --check web/portfolio_impact_v4/app.js
          node --check web/portfolio_impact_v4/connections.js
          node --check web/portfolio_impact_v4/recovery.js
